title: "Jamie Lab"
description: "Experiments. Networks. Homelab. Code."
url: "https://jamielab.me"
baseurl: ""
project_admin_api_url: ""
markdown: kramdown
highlighter: rouge

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false
excerpt_separator: "<!--more-->"
future: true

exclude:
  - docs/
  - api/
  - project-admin.md
  - assets/js/project-admin.js
  - CLAUDE.md
  - AGENTS.md
  - THEMES.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - bin/
  - vendor/

collections:
  notes:
    output: true
    permalink: /notes/:name/
  projects:
    output: true
    permalink: /projects/:name/
  info:
    output: true
    permalink: /info/:name/

defaults:
  - scope:
      type: posts
    values:
      layout: post
      permalink: "/blog/:year/:month/:day/:title/"

  - scope:
      type: notes
    values:
      layout: default

  - scope:
      type: projects
    values:
      layout: default

  - scope:
      type: info
    values:
      layout: default

# Giscus Comments Configuration
giscus:
  enabled: true
  repo: "jimjamscott22/jimjamscott22.github.io"  # Your GitHub repo in format: username/repo
  repo_id: ""  # You'll need to get this from giscus.app
  category: "Comments"  # GitHub Discussion category name
  category_id: ""  # You'll need to get this from giscus.app
  mapping: "pathname"  # Maps comments to specific posts
  reactions_enabled: true
  emit_metadata: false
  input_position: "bottom"
  theme: "dark"  # Fits your CRT theme
  lang: "en"

