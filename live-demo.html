document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ty:.5;\">{{ clock }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <section style=\"flex:1; min-height:0; display:flex; flex-direction:column; gap:18px; padding:24px 28px;\">\n      <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:16px;\">\n        <div>\n          <div style=\"font-size:11px; letter-spacing:3px; color:var(--ac); margin-bottom:6px;\">// AUTO-RUNNING WALKTHROUGH<\u002Fdiv>\n          <h1 style=\"margin:0; font-size:30px; font-weight:700; color:var(--ac2); letter-spacing:1px; text-shadow:0 0 16px var(--gl);\">Locking down a server with UFW<\u002Fh1>\n          <div style=\"font-size:13px; color:var(--dim); margin-top:7px;\">Default-deny ingress, allow only what you need, enable. The safe sequence — typed live.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1.75fr) 312px; gap:18px;\">\n\n        <div style=\"display:flex; flex-direction:column; min-height:0; border:1px solid var(--bd); background:#040b0f; box-shadow:0 0 30px rgba(0,229,255,0.07) inset, 0 8px 40px rgba(0,0,0,0.5);\">\n          <div style=\"display:flex; align-items:center; gap:8px; padding:9px 14px; border-bottom:1px solid var(--bd); background:rgba(0,229,255,0.05);\">\n            <span style=\"width:11px; height:11px; border-radius:50%; background:#ff5f56;\"><\u002Fspan>\n            <span style=\"width:11px; height:11px; border-radius:50%; background:#ffbd2e;\"><\u002Fspan>\n            <span style=\"width:11px; height:11px; border-radius:50%; background:#27c93f;\"><\u002Fspan>\n            <span style=\"margin-left:8px; font-size:12px; color:var(--dim);\">jamie@lab-vm-01: ~ — ufw-hardening.session<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"position:relative; flex:1; min-height:300px; overflow:hidden; padding:16px 18px; font-size:13.5px;\">\n            <div style=\"position:absolute; inset:0; padding:16px 18px; display:flex; flex-direction:column; justify-content:flex-end;\">{{ terminalLog }}<\u002Fdiv>\n            <div style=\"position:absolute; inset:0; pointer-events:none; background:var(--ac2); opacity:{{ flashOpacity }};\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:4px; background:rgba(0,229,255,0.12);\">\n            <div style=\"height:100%; width:{{ progressPct }}; background:var(--ac2); box-shadow:0 0 10px var(--ac2);\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; flex-direction:column; gap:14px; min-height:0; border:1px solid var(--bd); background:rgba(7,16,22,0.6); padding:16px;\">\n          <div style=\"font-size:11px; letter-spacing:2px; color:var(--ac); border-bottom:1px solid var(--bd); padding-bottom:9px;\">TARGET MONITOR<\u002Fdiv>\n\n          <div style=\"display:flex; justify-content:space-between; font-size:12.5px;\">\n            <span style=\"color:var(--dim);\">host<\u002Fspan><span style=\"color:#cfeaf1;\">lab-vm-01<\u002Fspan>\n          <\u002Fdiv>\n\n          <div>\n            <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:7px;\">\n              <span style=\"font-size:12.5px; color:var(--dim);\">firewall<\u002Fspan>\n              <span style=\"font-size:12.5px; font-weight:700; color:{{ fwColor }};\">{{ fwText }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; align-items:center;\">\n              <span style=\"font-size:12.5px; color:var(--dim);\">exposure<\u002Fspan>\n              <span style=\"font-size:12.5px; font-weight:700; color:{{ exposureColor }};\">{{ exposureLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"margin-top:7px; height:8px; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.06);\">\n              <div style=\"height:100%; width:{{ exposureWidth }}; background:{{ exposureColor }}; box-shadow:0 0 10px {{ exposureColor }}; transition:width .25s linear;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex; gap:8px; font-size:11px;\">\n            <span style=\"flex:1; text-align:center; padding:5px 4px; border:1px solid var(--bd); color:{{ policyDenyColor }};\">deny incoming<\u002Fspan>\n            <span style=\"flex:1; text-align:center; padding:5px 4px; border:1px solid var(--bd); color:{{ policyOutColor }};\">allow outgoing<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"font-size:11px; letter-spacing:2px; color:var(--ac); margin-top:2px;\">INGRESS RULES<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:8px;\">\n            <sc-for list=\"{{ ports }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; align-items:center; gap:10px; font-size:12.5px; padding:7px 9px; border:1px solid rgba(255,255,255,0.06); background:rgba(0,0,0,0.25);\">\n                <span style=\"width:8px; height:8px; border-radius:50%; background:{{ p.color }}; box-shadow:0 0 7px {{ p.color }};\"><\u002Fspan>\n                <span style=\"color:#cfeaf1; min-width:46px;\">{{ p.label }}<\u002Fspan>\n                <span style=\"color:var(--dim); flex:1;\">{{ p.sub }}<\u002Fspan>\n                <span style=\"font-weight:700; color:{{ p.color }};\">{{ p.status }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; align-items:stretch; gap:16px;\">\n        <sc-if value=\"{{ calloutShow }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"flex:1; display:flex; gap:16px; align-items:center; border:1px solid {{ calloutBorder }}; background:rgba(0,229,255,0.04); padding:14px 18px; box-shadow:0 0 18px rgba(0,229,255,0.05);\">\n            <div style=\"font-size:32px; font-weight:700; color:{{ calloutNumColor }}; text-shadow:0 0 14px currentColor; line-height:1;\">{{ callout.num }}<\u002Fdiv>\n            <div>\n              <div style=\"font-size:13px; font-weight:700; letter-spacing:2px; color:{{ calloutTitleColor }};\">{{ callout.title }}<\u002Fdiv>\n              <div style=\"font-size:13px; color:#aecbd4; margin-top:4px;\">{{ callout.body }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <button onclick=\"{{ replay }}\" style=\"flex:none; align-self:stretch; min-width:150px; padding:0 22px; cursor:pointer; font-family:inherit; font-size:13px; font-weight:700; letter-spacing:2px; color:#031014; background:var(--ac2); border:none; box-shadow:0 0 18px var(--gl); opacity:{{ replayOpacity }};\">▸ REPLAY<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <footer style=\"display:flex; align-items:center; justify-content:space-between; padding:9px 24px; border-top:1px solid var(--bd); font-size:11px; color:var(--dim); background:rgba(7,16,22,0.55);\">\n      <span>IFCONFIG: homelab up | tailscale active | pihole filtering<\u002Fspan>\n      <span>jamielab.me :: experimental zone<\u002Fspan>\n    <\u002Ffooter>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;speed&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:1,&quot;min&quot;:0.5,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;},&quot;showCallouts&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;palette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;cyber&quot;,&quot;options&quot;:[&quot;cyber&quot;,&quot;matrix&quot;,&quot;neon&quot;],&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = { t: 0 };\n\n  constructor(props) {\n    super(props);\n    this.PROMPT = 'jamie@lab-vm-01:~$ ';\n    this.cps = 22;\n    this.END = 29.6;\n    this.cmds = [\n      { t: 2.0, cmd: 'sudo ufw default deny incoming', outs: [[3.5, \"Default incoming policy changed to 'deny'\", 'dim'], [3.7, '(be sure to update your rules accordingly)', 'dim']] },\n      { t: 5.0, cmd: 'sudo ufw default allow outgoing', outs: [[6.5, \"Default outgoing policy changed to 'allow'\", 'dim']] },\n      { t: 8.0, cmd: 'sudo ufw allow ssh', outs: [[9.0, 'Rule added', 'dim'], [9.15, 'Rule added (v6)', 'dim']] },\n      { t: 10.2, cmd: 'sudo ufw allow 80/tcp', outs: [[11.35, 'Rule added', 'dim'], [11.5, 'Rule added (v6)', 'dim']] },\n      { t: 12.2, cmd: 'sudo ufw allow 443/tcp', outs: [[13.4, 'Rule added', 'dim'], [13.55, 'Rule added (v6)', 'dim']] },\n      { t: 14.6, cmd: 'sudo ufw limit ssh', outs: [[15.6, 'Rule updated', 'dim'], [15.75, 'Rule updated (v6)', 'dim']] },\n      { t: 17.4, cmd: 'sudo ufw enable', outs: [[18.5, 'Command may disrupt existing ssh connections. Proceed? (y|n) y', 'dim'], [19.2, 'Firewall is active and enabled on system startup', 'ok']] },\n      { t: 21.2, cmd: 'sudo ufw status numbered', outs: [\n        [22.5, 'Status: active', 'ok'],\n        [22.7, '', 'dim'],\n        [22.85, '     To              Action    From', 'head'],\n        [23.0, '     --              ------    ----', 'head'],\n        [23.2, '[ 1] 22/tcp (SSH)    LIMIT IN  Anywhere', 'row'],\n        [23.4, '[ 2] 80/tcp          ALLOW IN  Anywhere', 'row'],\n        [23.6, '[ 3] 443/tcp         ALLOW IN  Anywhere', 'row'],\n        [23.8, '[ 4] 22/tcp (v6)     LIMIT IN  Anywhere (v6)', 'row'],\n      ] },\n    ];\n    this.calloutWins = [\n      [2.0, 7.8, { num: '01', title: 'DEFAULT-DENY', body: 'Block every inbound packet by default. Whitelist only what you truly need.' }, false],\n      [7.8, 14.4, { num: '02', title: 'ALLOW SSH FIRST', body: \"Open SSH before enabling UFW — skip this and you'll lock yourself out of the box.\" }, true],\n      [14.4, 17.4, { num: '03', title: 'RATE-LIMIT SSH', body: 'ufw limit throttles repeat connections to blunt brute-force attempts.' }, false],\n      [17.4, 21.2, { num: '04', title: 'ENABLE', body: 'Activate the firewall — your rules now persist across every reboot.' }, false],\n      [21.2, 99, { num: '05', title: 'LOCKED DOWN', body: 'Verify with status numbered. Ingress is sealed; blast radius minimized.' }, false],\n    ];\n    this.setRoot = (el) => { this.rootEl = el; this.applyPalette(); };\n    this.replay = () => {\n      this._start = performance.now();\n      this._ended = false;\n      this.setState({ t: 0 });\n      this.loop();\n    };\n  }\n\n  componentDidMount() {\n    const d = new Date();\n    const p = (n) => String(n).padStart(2, '0');\n    this.clock = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;\n    this.applyPalette();\n    this._start = performance.now();\n    this.loop();\n  }\n\n  componentDidUpdate(prev) {\n    if (prev && prev.palette !== this.props.palette) this.applyPalette(true);\n  }\n\n  componentWillUnmount() { if (this._raf) cancelAnimationFrame(this._raf); }\n\n  loop = () => {\n    const speed = this.props.speed || 1;\n    let t = (performance.now() - this._start) / 1000 * speed;\n    if (t >= this.END) { t = this.END; this._ended = true; this.setState({ t }); return; }\n    this.setState({ t });\n    this._raf = requestAnimationFrame(this.loop);\n  };\n\n  palette() {\n    const m = {\n      cyber: { accent: '#00e5ff', accent2: '#00ff88', warn: '#ffb454', danger: '#ff5a6a', dim: '#6f97a3', border: 'rgba(0,229,255,0.38)', glow: 'rgba(0,229,255,0.5)' },\n      matrix: { accent: '#33ff99', accent2: '#9dffce', warn: '#ffd166', danger: '#ff7a8a', dim: '#5fae7e', border: 'rgba(51,255,153,0.34)', glow: 'rgba(51,255,153,0.45)' },\n      neon: { accent: '#00e5ff', accent2: '#b46bff', warn: '#ffb454', danger: '#ff5a7a', dim: '#8a86c9', border: 'rgba(180,107,255,0.40)', glow: 'rgba(180,107,255,0.5)' },\n    };\n    return m[this.props.palette] || m.cyber;\n  }\n\n  applyPalette(force) {\n    if (!this.rootEl) return;\n    const p = this.palette();\n    const map = { '--ac': p.accent, '--ac2': p.accent2, '--bd': p.border, '--gl': p.glow, '--dim': p.dim, '--warn': p.warn, '--danger': p.danger };\n    for (const k in map) this.rootEl.style.setProperty(k, map[k]);\n  }\n\n  ss(a, b, x) { if (x <= a) return 0; if (x >= b) return 1; const u = (x - a) / (b - a); return u * u * (3 - 2 * u); }\n  mix(a, b, t) { return a + (b - a) * t; }\n\n  buildLines(t, pal) {\n    const lines = [];\n    lines.push({ text: '\\u25CF secure shell opened on lab-vm-01 \\u2014 hardening session', color: pal.dim });\n    lines.push({ text: '', color: pal.dim });\n    for (const c of this.cmds) {\n      if (t < c.t) break;\n      const dur = c.cmd.length / this.cps;\n      const n = Math.min(c.cmd.length, Math.floor((t - c.t) * this.cps));\n      const typing = t < c.t + dur;\n      lines.push({ prompt: this.PROMPT, text: c.cmd.slice(0, n), color: pal.accent2, glow: true, typing });\n      if (!typing) {\n        for (const o of c.outs) {\n          if (t >= o[0]) {\n            let col = pal.dim, bold = false, glow = false, pre = false;\n            if (o[2] === 'ok') { col = pal.accent2; bold = true; glow = true; }\n            else if (o[2] === 'row') { col = '#bfe9f2'; pre = true; }\n            else if (o[2] === 'head') { col = pal.dim; pre = true; }\n            lines.push({ text: o[1], color: col, bold, glow, pre });\n          }\n        }\n      }\n    }\n    return lines;\n  }\n\n  renderVals() {\n    const t = this.state.t || 0;\n    const pal = this.palette();\n    const lines = this.buildLines(t, pal);\n\n    const log = React.createElement(\n      'div', { style: { display: 'flex', flexDirection: 'column', justifyContent: 'flex-end' } },\n      lines.map((ln, i) => React.createElement(\n        'div', { key: i, style: { whiteSpace: ln.pre ? 'pre' : 'pre-wrap', lineHeight: 1.5, wordBreak: ln.pre ? 'normal' : 'break-word' } },\n        ln.prompt ? React.createElement('span', { style: { color: pal.accent } }, ln.prompt) : null,\n        React.createElement('span', { style: { color: ln.color, fontWeight: ln.bold ? 700 : 400, textShadow: ln.glow ? '0 0 9px ' + ln.color : 'none' } }, ln.text || '\\u00A0'),\n        ln.typing ? React.createElement('span', { style: { display: 'inline-block', width: '0.55ch', height: '1.05em', background: pal.accent2, marginLeft: '2px', transform: 'translateY(3px)', boxShadow: '0 0 8px ' + pal.accent2, animation: 'tcaret 0.9s steps(1) infinite' } }) : null\n      ))\n    );\n\n    // exposure\n    let e = 0.92;\n    e = this.mix(e, 0.55, this.ss(3.6, 4.6, t));\n    e = this.mix(e, 0.12, this.ss(19.2, 20.4, t));\n    let exposureLabel, exposureColor;\n    if (e > 0.7) { exposureLabel = 'HIGH'; exposureColor = pal.danger; }\n    else if (e > 0.3) { exposureLabel = 'GUARDED'; exposureColor = pal.warn; }\n    else { exposureLabel = 'MINIMAL'; exposureColor = pal.accent2; }\n\n    const fwActive = t >= 19.2;\n\n    const portState = (allow, special) => {\n      if (special && t >= special) return { status: 'LIMIT', color: pal.accent, on: true };\n      if (t >= allow) return { status: 'ALLOW', color: pal.accent2, on: true };\n      return { status: 'DENY', color: pal.danger, on: false };\n    };\n    const ssh = portState(9.0, 15.6);\n    const http = portState(11.35, null);\n    const https = portState(13.4, null);\n    const ports = [\n      { label: '22', sub: 'SSH', status: ssh.status, color: ssh.on ? ssh.color : pal.dim },\n      { label: '80', sub: 'HTTP', status: http.status, color: http.on ? http.color : pal.dim },\n      { label: '443', sub: 'HTTPS', status: https.status, color: https.on ? https.color : pal.dim },\n    ];\n\n    // callout\n    let win = null;\n    for (const w of this.calloutWins) { if (t >= w[0] && t < w[1]) { win = w; break; } }\n    const callout = win ? win[2] : { num: '', title: '', body: '' };\n    const warn = win ? win[3] : false;\n    const calloutShow = !!win && (this.props.showCallouts !== false);\n\n    return {\n      setRoot: this.setRoot,\n      replay: this.replay,\n      clock: this.clock || '',\n      terminalLog: log,\n      progressPct: Math.round(Math.min(1, t / this.END) * 100) + '%',\n      flashOpacity: Math.max(0, 0.4 * (1 - Math.abs(t - 19.2) / 0.6)),\n      fwText: fwActive ? 'ACTIVE' : 'STANDBY',\n      fwColor: fwActive ? pal.accent2 : pal.warn,\n      exposureLabel, exposureColor,\n      exposureWidth: Math.round(e * 100) + '%',\n      policyDenyColor: t >= 3.5 ? pal.accent2 : pal.dim,\n      policyOutColor: t >= 6.5 ? pal.accent2 : pal.dim,\n      ports,\n      calloutShow,\n      callout,\n      calloutBorder: warn ? pal.warn : pal.border,\n      calloutNumColor: warn ? pal.warn : pal.accent,\n      calloutTitleColor: warn ? pal.warn : pal.accent2,\n      replayOpacity: this.ss(this.END - 2.2, this.END - 0.4, t),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
